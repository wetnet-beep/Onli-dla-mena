<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Почта</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0d4f2b, #0a3d1f, #0d47a1, #0a3570);
            background-size: 100% 100%;
            color: #e0f7e0;
            text-align: center;
            min-height: 100vh;
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .box {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 20px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        h2.app-title { font-size: 1.5em; margin-bottom: 5px; color: #00ff88; }
        .vip-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            font-size: 0.7em;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
            animation: glow 1.5s infinite;
            display: inline-block;
            margin-bottom: 10px;
        }
        @keyframes glow {
            0%,100% { box-shadow: 0 0 10px #ffd700; }
            50% { box-shadow: 0 0 25px #ffd700; }
        }
        .info-row {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 12px;
            margin: 8px 0;
            text-align: left;
            font-size: 0.9em;
        }
        .info-row .label { color: #aaa; font-size: 0.75em; }
        .info-row .value { color: #fff; word-break: break-all; font-size: 0.85em; margin-top: 2px; }
        .email-box {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 1.1em;
            word-break: break-all;
            color: #fff;
        }
        .timer {
            font-size: 1.3em;
            font-weight: bold;
            color: #00ff88;
            margin: 8px 0;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 12px 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            min-width: 44px;
            min-height: 44px;
        }
        button:active {
            background: rgba(255,255,255,0.25);
            transform: scale(0.95);
        }
        .refresh-btn { background: rgba(0,200,100,0.2); border-color: rgba(0,200,100,0.4); color: #00ff88; }
        .copy-btn { background: rgba(0,150,255,0.2); border-color: rgba(0,150,255,0.4); color: #66ccff; }
        .new-btn { background: rgba(255,180,0,0.2); border-color: rgba(255,180,0,0.4); color: #ffbb33; }
        .msg {
            background: rgba(255,255,255,0.05);
            padding: 14px;
            margin: 6px 0;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            border-left: 3px solid #00cc66;
            transition: background 0.2s;
        }
        .msg:active { background: rgba(255,255,255,0.15); }
        .msg .from { font-weight: bold; color: #66ddbb; font-size: 0.9em; }
        .msg .subject { color: #ddd; font-size: 0.85em; margin-top: 2px; }
        .msg .preview { color: #999; font-size: 0.75em; margin-top: 3px; }
        .email-full {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            text-align: left;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .email-full .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.9em;
            margin-bottom: 12px;
        }
        .email-full .full-from { color: #66ddbb; margin-bottom: 4px; }
        .email-full .full-subject { color: #fff; font-size: 1.2em; font-weight: bold; margin-bottom: 12px; }
        .email-full .full-body { color: #ccc; line-height: 1.5; word-break: break-word; font-size: 0.9em; }

        /* Блок входа в существующий */
        .login-section {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .login-section h4 { color: #aaa; font-size: 0.85em; margin-bottom: 8px; }
        .login-section input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 0.9em;
            text-align: center;
            outline: none;
            margin: 5px 0;
        }
        .login-section input::placeholder { color: #777; }
        .login-btn {
            background: rgba(100,200,255,0.15) !important;
            border-color: rgba(100,200,255,0.35) !important;
            color: #66ccff !important;
            width: 100%;
            margin-top: 5px;
        }
        #statusMsg { font-size: 0.8em; margin: 5px 0; color: #ffbb33; min-height: 18px; }
        hr { border-color: rgba(255,255,255,0.08); margin: 15px 0; }
    </style>
</head>
<body>

<div class="box" id="appScreen">
    <h2 class="app-title">💎 VIP Почта</h2>
    <div class="vip-badge">👑 ELITE</div>
    
    <!-- Адрес -->
    <div class="email-box" id="emailAddr">Загрузка...</div>
    
    <!-- Данные для входа -->
    <div class="info-row" id="loginInfo" style="display:none">
        <div class="label">🔑 Сохрани данные для входа:</div>
        <div class="value">Адрес: <b id="showAddr"></b></div>
        <div class="value">Пароль: <b id="showPass"></b></div>
    </div>
    
    <div class="btn-row">
        <button class="copy-btn" onclick="copyEmail()">📋 Адрес</button>
        <button class="copy-btn" onclick="copyLoginInfo()">🔐 Данные</button>
        <button class="refresh-btn" onclick="refreshInbox()">🔄 Обновить</button>
        <button class="new-btn" onclick="createNewBox()">➕ Новый</button>
    </div>
    
    <div class="timer" id="timer">♾ Бессрочный</div>
    <div id="statusMsg"></div>
    
    <hr>
    <h3>📩 Входящие</h3>
    <div id="inbox">Загрузка...</div>
    <div id="emailView"></div>
    
    <!-- Вход в существующий ящик -->
    <div class="login-section">
        <h4>📥 Войти в свой ящик</h4>
        <input type="text" id="manualEmail" placeholder="Адрес почты">
        <input type="text" id="manualPass" placeholder="Пароль">
        <button class="login-btn" onclick="manualLogin()">Войти</button>
    </div>
</div>

<script>
let token = '';
let email = '';
let boxPassword = '';
let allMessages = [];

const API = 'https://api.mail.tm';
const eliteNicks = ['vip', 'boss', 'king', 'star', 'pro', 'ace', 'max', 'lux', 'gold', 'cool'];

// ====== СОХРАНЕНИЕ ======
function saveBox(tokenVal, emailVal, passVal) {
    localStorage.setItem('vipmail_token', tokenVal);
    localStorage.setItem('vipmail_email', emailVal);
    localStorage.setItem('vipmail_pass', passVal);
}

function loadSavedBox() {
    const t = localStorage.getItem('vipmail_token');
    const e = localStorage.getItem('vipmail_email');
    const p = localStorage.getItem('vipmail_pass');
    if (t && e) return { token: t, email: e, password: p };
    return null;
}

function clearSavedBox() {
    localStorage.removeItem('vipmail_token');
    localStorage.removeItem('vipmail_email');
    localStorage.removeItem('vipmail_pass');
}

async function getDomain() {
    const res = await fetch(API + '/domains');
    const data = await res.json();
    return data['hydra:member'][0].domain;
}

async function createAccount(address, password) {
    await fetch(API + '/accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address, password })
    });
}

async function getToken(address, password) {
    const res = await fetch(API + '/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address, password })
    });
    const data = await res.json();
    return data.token;
}

async function fetchMessages() {
    if (!token) return [];
    try {
        const res = await fetch(API + '/messages', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) return [];
        const data = await res.json();
        return data['hydra:member'] || [];
    } catch(e) {
        return [];
    }
}

async function fetchMessageById(msgId) {
    try {
        const res = await fetch(API + '/messages/' + msgId, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) return null;
        return await res.json();
    } catch(e) {
        return null;
    }
}

async function refreshInbox() {
    document.getElementById('statusMsg').textContent = '🔄 Обновляю...';
    allMessages = await fetchMessages();
    renderInboxList();
    document.getElementById('statusMsg').textContent = '✅ Обновлено';
    setTimeout(() => {
        if (document.getElementById('statusMsg').textContent === '✅ Обновлено') {
            document.getElementById('statusMsg').textContent = '';
        }
    }, 2000);
}

function renderInboxList() {
    const inbox = document.getElementById('inbox');
    document.getElementById('emailView').innerHTML = '';
    inbox.style.display = 'block';
    
    if (!token) {
        inbox.innerHTML = 'Войдите в ящик...';
        return;
    }
    if (allMessages.length === 0) {
        inbox.innerHTML = '📭 Писем пока нет...';
        return;
    }
    inbox.innerHTML = allMessages.map(m =>
        `<div class="msg" onclick="openEmail('${m.id}')">
            <div class="from">${m.from?.address || 'Неизвестно'}</div>
            <div class="subject"><b>${m.subject || '(без темы)'}</b></div>
            <div class="preview">${m.intro || ''}</div>
        </div>`
    ).join('');
}

async function openEmail(msgId) {
    const view = document.getElementById('emailView');
    view.innerHTML = '<div class="email-full">⏳ Загрузка...</div>';
    document.getElementById('inbox').style.display = 'none';
    
    const msg = await fetchMessageById(msgId);
    if (!msg) {
        view.innerHTML = '<div class="email-full">❌ Ошибка загрузки</div>';
        return;
    }
    
    let body = msg.html || msg.text || '(пустое письмо)';
    
    view.innerHTML = `
        <div class="email-full">
            <button class="back-btn" onclick="closeEmail()">← Назад</button>
            <div class="full-from">От: ${msg.from?.address || 'Неизвестно'}</div>
            <div class="full-subject">${msg.subject || '(без темы)'}</div>
            <hr>
            <div class="full-body">${body}</div>
        </div>
    `;
}

function closeEmail() {
    document.getElementById('emailView').innerHTML = '';
    document.getElementById('inbox').style.display = 'block';
}

async function copyEmail() {
    if (!email) return;
    try {
        await navigator.clipboard.writeText(email);
        document.getElementById('statusMsg').textContent = '📋 Адрес скопирован!';
    } catch(e) {
        document.getElementById('statusMsg').textContent = '📋 Скопировано!';
    }
    setTimeout(() => {
        if (document.getElementById('statusMsg').textContent === '📋 Адрес скопирован!') {
            document.getElementById('statusMsg').textContent = '';
        }
    }, 2000);
}

async function copyLoginInfo() {
    if (!email || !boxPassword) return;
    const text = `Адрес: ${email}\nПароль: ${boxPassword}`;
    try {
        await navigator.clipboard.writeText(text);
        document.getElementById('statusMsg').textContent = '🔐 Данные скопированы!';
    } catch(e) {
        document.getElementById('statusMsg').textContent = '🔐 Скопировано!';
    }
    setTimeout(() => {
        if (document.getElementById('statusMsg').textContent === '🔐 Данные скопированы!') {
            document.getElementById('statusMsg').textContent = '';
        }
    }, 2000);
}

function showLoginInfo() {
    document.getElementById('showAddr').textContent = email;
    document.getElementById('showPass').textContent = boxPassword;
    document.getElementById('loginInfo').style.display = 'block';
}

async function manualLogin() {
    const addr = document.getElementById('manualEmail').value.trim();
    const pass = document.getElementById('manualPass').value.trim();
    
    if (!addr || !pass) {
        document.getElementById('statusMsg').textContent = 'Введи адрес и пароль';
        return;
    }
    
    document.getElementById('statusMsg').textContent = '⏳ Вхожу...';
    
    try {
        const res = await fetch(API + '/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ address: addr, password: pass })
        });
        
        if (!res.ok) {
            document.getElementById('statusMsg').textContent = '❌ Неверные данные';
            return;
        }
        
        const data = await res.json();
        token = data.token;
        email = addr;
        boxPassword = pass;
        saveBox(token, email, boxPassword);
        document.getElementById('emailAddr').textContent = email;
        document.getElementById('manualEmail').value = '';
        document.getElementById('manualPass').value = '';
        document.getElementById('statusMsg').textContent = '✅ Успешный вход!';
        showLoginInfo();
        refreshInbox();
    } catch(e) {
        document.getElementById('statusMsg').textContent = '❌ Ошибка';
    }
}

async function createNewBox() {
    clearSavedBox();
    document.getElementById('emailView').innerHTML = '';
    document.getElementById('loginInfo').style.display = 'none';
    document.getElementById('statusMsg').textContent = '⏳ Создаю элитный ящик...';
    await initNewBox();
}

async function initNewBox() {
    try {
        const domain = await getDomain();
        const eliteNick = eliteNicks[Math.floor(Math.random() * eliteNicks.length)];
        const eliteNum = Math.floor(Math.random() * 888) + 100;
        const address = eliteNick + eliteNum + '@' + domain;
        const password = 'VIP' + Math.random().toString(36).substring(2, 8) + '!';

        await createAccount(address, password);
        token = await getToken(address, password);
        email = address;
        boxPassword = password;
        saveBox(token, email, boxPassword);
        document.getElementById('emailAddr').textContent = email;
        document.getElementById('statusMsg').textContent = '✅ Ящик создан!';
        showLoginInfo();
        allMessages = await fetchMessages();
        renderInboxList();
    } catch(e) {
        document.getElementById('statusMsg').textContent = '❌ Ошибка. Проверьте интернет.';
    }
}

// Обработка Enter в полях входа
document.getElementById('manualPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') manualLogin();
});

// Автообновление
setInterval(async () => {
    if (token && !document.getElementById('emailView').innerHTML) {
        allMessages = await fetchMessages();
        renderInboxList();
    }
}, 8000);

// Запуск
(async function start() {
    const saved = loadSavedBox();
    if (saved) {
        token = saved.token;
        email = saved.email;
        boxPassword = saved.password || '';
        document.getElementById('emailAddr').textContent = email;
        if (boxPassword) showLoginInfo();
        document.getElementById('statusMsg').textContent = '✅ Ящик восстановлен';
        refreshInbox();
    } else {
        await initNewBox();
    }
})();
</script>
</body>
</html>
